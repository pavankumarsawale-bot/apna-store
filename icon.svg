<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.4"/>
  
  <!-- Store Building / Canopy Top -->
  <path d="M120 180 L392 180 L370 120 L142 120 Z" fill="url(#cartGrad)"/>
  <rect x="140" y="105" width="232" height="20" rx="6" fill="#fef08a"/>
  
  <!-- Shopping Cart Body -->
  <path d="M140 220 L170 330 L360 330 L385 220 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  
  <!-- Cart Lines -->
  <line x1="200" y1="230" x2="200" y2="320" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="230" x2="256" y2="320" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="312" y1="230" x2="312" y2="320" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Cart Handle -->
  <path d="M110 190 L140 220" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Cart Wheels -->
  <circle cx="200" cy="380" r="26" fill="url(#cartGrad)"/>
  <circle cx="200" cy="380" r="10" fill="#ffffff"/>
  <circle cx="330" cy="380" r="26" fill="url(#cartGrad)"/>
  <circle cx="330" cy="380" r="10" fill="#ffffff"/>
  
  <!-- Text Label -->
  <text x="256" y="450" font-family="-apple-system, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">SAWALE STORE</text>
</svg>
